name: FIRBO Admin OmniRoute FreeLLMAPI Login Links
on:
  pull_request:
    branches:
      - codex/firbo-identical-keys-safe-quota-readback-20261010
    paths:
      - frontend/src/components/gateway/ServiceAccessPanel.tsx
      - frontend/src/components/gateway/ServiceAccessPanel.test.tsx
      - .github/workflows/firbo-admin-external-logins.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Respect locked npm engine
        run: npm install --global npm@11.19.0
      - name: Install existing frontend lockfile
        working-directory: frontend
        run: npm ci
      - name: Verify owner admin login links and dashboard privacy
        working-directory: frontend
        run: npx --no-install vitest run src/components/gateway/ServiceAccessPanel.test.tsx src/lib/company/service-dashboards.test.ts
      - name: Full frontend CI tests and production build
        working-directory: frontend
        run: |
          npm test
          npm run build:tauri

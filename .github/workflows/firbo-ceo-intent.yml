name: FIRBO CEO intent and worker routing regression
on:
  pull_request:
    branches: [codex/firbo-vps-dispatch-20261009, codex/firbo-ceo-intent-20261009]
    paths:
      - 'frontend/src/lib/company/computer-continuation.ts'
      - 'frontend/src/lib/company/computer-continuation.test.ts'
      - 'frontend/src/lib/company/useCeoSession.ts'
      - 'frontend/src/pages/AgentChatPage.tsx'
      - 'docs/FIRBO-EXTERNAL-GITHUB-REGISTRY-20261009.md'
      - 'frontend/src/lib/company/laptop-bridge.ts'
      - 'frontend/src/lib/company/laptop-bridge.test.ts'
      - 'frontend/src/lib/company/useCeoSession.computer.test.ts'
      - 'frontend/src/pages/AgentChatPage.computer.test.tsx'
      - '.github/workflows/firbo-ceo-intent.yml'
permissions:
  contents: read
concurrency:
  group: firbo-ceo-intent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend-real-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned reviewed checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned reviewed Node setup
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use the reviewed npm toolchain
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Run all real frontend regression tests
        run: npm test
      - name: Type-check and production Vite build
        run: npm run build:tauri

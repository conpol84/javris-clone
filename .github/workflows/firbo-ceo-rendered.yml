name: FIRBO CEO rendered mobile acceptance

on:
  pull_request:
    paths:
      - 'frontend/src/pages/CeoPage.tsx'
      - 'frontend/src/components/company/CeoSessionHistory.tsx'
      - 'frontend/src/lib/company/useCeoSession.ts'
      - 'frontend/preview/ceo-rendered-smoke.mjs'
      - 'frontend/preview/mock-client.ts'
      - '.github/workflows/firbo-ceo-rendered.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Chromium mobile/tablet/desktop CEO acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Setup pinned npm
        run: npm install --global npm@11.19.0
      - name: Install project and isolated browser tooling
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start synthetic authenticated FIRBO preview (not real Supabase)
        run: |
          npm run preview:mock -- --host 127.0.0.1 > /tmp/firbo-ceo-preview.log 2>&1 &
          echo $! > /tmp/firbo-ceo-preview.pid
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:5200/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/firbo-ceo-preview.log
          exit 1
      - name: Run rendered CEO mobile/tablet/desktop probes
        run: node preview/ceo-rendered-smoke.mjs
      - name: Publish only synthetic CEO screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firbo-ceo-synthetic-mobile
          path: frontend/ceo-mobile-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

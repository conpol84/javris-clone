name: FIRBO CEO connected-app allowlist regression
on:
  push:
    branches:
      - codex/firbo-connected-app-hardening-20261011
  pull_request:
    branches:
      - codex/firbo-ceo-connected-app-context-20261011
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connected-app-allowlist:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Confirm approved kinds only
        run: node --experimental-strip-types --test tests/firbo/ceo-connected-apps.test.mjs tests/firbo/edge-entrypoints.test.mjs

name: Firbo reviewed Dark voice candidate
on:
  push:
    branches: [codex/firbo-unified-gateway]
    paths: ['.github/workflows/firbo-dark-source-once.yml','tests/firbo/dark-voice/transfer-*.once.b64']
permissions:
  contents: read
jobs:
  reviewed:
    if: github.repository == 'conpol84/javris-clone' && github.event.head_commit.message == 'Verify exact Dark voice source before runtime release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Apply checksum-verified reviewed source, preserving every other file
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          parts=[Path(f'tests/firbo/dark-voice/transfer-{i}.once.b64').read_text() for i in range(6)]
          packed=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='f8edb76fdbb3a94f5424b04d3aadec47ad4bee0161f6936a932270e06c8622a7'
          edits=json.loads(gzip.decompress(packed))
          allowed={'.github/workflows/firbo-dark-voice.yml','frontend/src/components/command/TalkConsole.tsx','frontend/src/components/voice/VoiceProfileControl.tsx','frontend/src/lib/company/speechAudio.ts','frontend/src/lib/company/voice.test.ts','frontend/src/lib/company/voice.ts','frontend/src/lib/company/voiceProfile.ts','frontend/src/pages/CeoPage.tsx','supabase/functions/agent-speak/audio-profile.ts','supabase/functions/agent-speak/handler.ts','supabase/functions/agent-speak/index.ts','tests/firbo/dark-voice/voice.test.mjs','tests/firbo/voice/verify.py'}
          assert set(edits)==allowed
          sha=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for name,item in edits.items():
            p=Path(name)
            if 'before' in item:
              old=p.read_bytes();assert sha(old)==item['before'],name
              lines=old.decode().splitlines(True)
              for start,end,new in reversed(item['edits']):lines[start:end]=[new]
              data=''.join(lines).encode()
            else:
              assert not p.exists(),name
              data=item['content'].encode()
            assert sha(data)==item['after'],name
            p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          Path('/tmp/firbo-dark-manifest.json').write_text(json.dumps(edits))
          PY
      - run: npm install --global npm@11.19.0
      - run: npm ci
        working-directory: frontend
      - name: Actual waveform and handler contracts without model or customer credentials
        run: node --experimental-strip-types --test tests/firbo/dark-voice/voice.test.mjs
      - name: Complete frontend regression, types and build
        working-directory: frontend
        run: |
          npm test
          npx --no-install tsc -b
          npx --no-install tsc --ignoreConfig --noEmit --target es2022 --module esnext --moduleResolution bundler --allowImportingTsExtensions --lib ES2022,DOM --skipLibCheck ../supabase/functions/agent-speak/audio-profile.ts ../supabase/functions/agent-speak/handler.ts
          npm run build:tauri
          npx --no-install vite build --config vite.voice.config.ts
      - name: Generate a processed tone using the exact server audio implementation
        run: |
          mkdir -p /tmp/firbo-dark-evidence
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          import {renderWave,DARK_PROFILE,SAMPLE_RATE} from './supabase/functions/agent-speak/audio-profile.ts';
          const input=new Uint8Array(SAMPLE_RATE*4*2),v=new DataView(input.buffer);
          for(let i=0;i<input.length/2;i++)v.setInt16(i*2,Math.round(5000*Math.sin(2*Math.PI*200*i/SAMPLE_RATE)),true);
          fs.writeFileSync('/tmp/firbo-dark-evidence/processed-test-tone.wav',renderWave(input,DARK_PROFILE));
          JS
      - name: Install isolated browser dependencies
        run: |
          python3 -m venv /tmp/firbo-dark-python
          /tmp/firbo-dark-python/bin/pip install playwright==1.57.0
          /tmp/firbo-dark-python/bin/python -m playwright install --with-deps chromium
      - name: Real voice screens with processed audio and synthetic services
        env:
          FIRBO_VOICE_OUTPUT: /tmp/firbo-dark-evidence/browser
          FIRBO_VOICE_WAV: /tmp/firbo-dark-evidence/processed-test-tone.wav
        run: |
          set -euo pipefail
          (cd frontend && npx --no-install vite preview --config vite.voice.config.ts --host 127.0.0.1 --port 5212) >/tmp/firbo-dark-vite.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5212/ >/dev/null && break; sleep 1; done
          /tmp/firbo-dark-python/bin/python tests/firbo/voice/verify.py
      - name: Store the tested Git tree; never deploy or update branch refs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const edits=JSON.parse(fs.readFileSync('/tmp/firbo-dark-manifest.json','utf8'));
          async function api(path,body){const r=await fetch('https://api.github.com/repos/conpol84/javris-clone'+path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+process.env.GH_TOKEN,'content-type':'application/json',accept:'application/vnd.github+json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw new Error('Git API '+r.status);return r.json();}
          const entries=[];
          for(const[path,item]of Object.entries(edits)){const b=await api('/git/blobs',{content:fs.readFileSync(path,'utf8'),encoding:'utf-8'});if(b.sha!==item.after)throw new Error('Blob mismatch '+path);entries.push({path,mode:'100644',type:'blob',sha:b.sha});}
          const remove=['.github/workflows/firbo-dark-source-once.yml',...Array.from({length:6},(_,i)=>`tests/firbo/dark-voice/transfer-${i}.once.b64`)];
          for(const path of remove)entries.push({path,mode:'100644',type:'blob',sha:null});
          const parent=await api('/git/commits/'+process.env.GITHUB_SHA);
          const tree=await api('/git/trees',{base_tree:parent.tree.sha,tree:entries});
          const proof={source_parent:process.env.GITHUB_SHA,tree:tree.sha,entries,scope:'Exact reviewed Dark voice; tests use synthetic audio/services, no live inference or account'};
          fs.writeFileSync('/tmp/firbo-dark-evidence/verified-tree.json',JSON.stringify(proof,null,2));
          console.log('FIRBO_DARK_VERIFIED_TREE '+tree.sha);
          console.log('FIRBO_DARK_VERIFIED_PARENT '+process.env.GITHUB_SHA);
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: firbo-dark-voice-verified
          path: |
            /tmp/firbo-dark-evidence/
            /tmp/firbo-dark-vite.log
          retention-days: 7

name: Firbo dependency release gate
on:
  push:
    branches: [main, claude/omniroute-engine, codex/firbo-unified-gateway]
    paths: ['frontend/package.json', 'frontend/package-lock.json', 'tests/firbo/dependency-audit.mjs', '.github/workflows/firbo-dependencies.yml']
  pull_request:
    branches: [main, claude/omniroute-engine]
    paths: ['frontend/package.json', 'frontend/package-lock.json', 'tests/firbo/dependency-audit.mjs', '.github/workflows/firbo-dependencies.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firbo-dependencies-${{ github.ref }}
  cancel-in-progress: true
jobs:
  advisory-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.0
      - name: Read-only advisory report and release gate
        run: node tests/firbo/dependency-audit.mjs

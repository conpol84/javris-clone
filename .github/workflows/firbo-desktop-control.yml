name: Firbo native desktop control
on:
  pull_request:
    branches: [claude/gifted-dijkstra-rph5j8, main]
    paths: ['frontend/public/firbo-*', 'supabase/functions/**', 'supabase/migrations/20261009020000_desktop_control.sql', 'tests/firbo/desktop-*', '.github/workflows/firbo-desktop-control.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool python3-pil python3-tk
      - run: node --test tests/firbo/desktop-control.test.mjs
      - run: xvfb-run -a /usr/bin/python3 tests/firbo/desktop-native.py

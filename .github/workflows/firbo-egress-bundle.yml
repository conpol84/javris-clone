name: Firbo egress deployment bundle
on:
  pull_request:
    branches: [claude/gifted-dijkstra-rph5j8]
    paths:
      - 'src/openjarvis/security/*egress.py'
      - 'src/openjarvis/server/firbo_*egress.py'
      - 'supabase/functions/_shared/*egress.ts'
      - 'deploy/firbo-egress-bundle.json'
      - 'tools/firbo-egress-bundle.mjs'
      - 'tools/firbo_egress_acceptance.py'
      - 'tests/firbo/egress-bundle.test.mjs'
      - 'tests/firbo/test_egress_acceptance.py'
      - '.github/workflows/firbo-egress-bundle.yml'
permissions:
  contents: read
jobs:
  deterministic-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.22.0'}
      - name: Verify service, Edge and release-configuration closure
        run: node --test tests/firbo/egress-bundle.test.mjs
      - name: Verify zero-dispatch deployed acceptance receipt
        run: python3 -m unittest tests/firbo/test_egress_acceptance.py -v
      - run: python3 -m pip install ruff==0.16.7
      - name: Lint and format acceptance probe
        run: |
          ruff check tools/firbo_egress_acceptance.py tests/firbo/test_egress_acceptance.py
          ruff format --check tools/firbo_egress_acceptance.py tests/firbo/test_egress_acceptance.py

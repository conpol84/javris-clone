name: FIRBO Greeklish owner action regression
on:
  pull_request:
    branches: [codex/firbo-ceo-intent-20261009]
    paths:
      - 'frontend/src/lib/company/laptop-bridge.ts'
      - 'frontend/src/lib/company/laptop-bridge.test.ts'
      - 'frontend/src/lib/company/useCeoSession.computer.test.ts'
      - 'frontend/src/pages/AgentChatPage.computer.test.tsx'
      - '.github/workflows/firbo-greeklish-intent.yml'
permissions:
  contents: read
concurrency:
  group: firbo-greeklish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tested-owner-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use reviewed npm
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm test
      - run: npm run build:tauri

name: Firbo integrations source snapshot
on:
  push:
    branches: [codex/firbo-unified-gateway]
    paths: ['.github/workflows/firbo-integrations-source-once.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'conpol84/javris-clone' && github.event.head_commit.message == 'Prepare exact existing source for four-provider integration implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: |
          mkdir -p /tmp/firbo-integrations-source
          git rev-parse HEAD > /tmp/firbo-integrations-source/SOURCE_COMMIT.txt
          git archive --format=tar.gz HEAD frontend supabase src/openjarvis/server tests/firbo docs .github/workflows deploy > /tmp/firbo-integrations-source/source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firbo-integrations-source
          path: /tmp/firbo-integrations-source/
          retention-days: 1
          if-no-files-found: error

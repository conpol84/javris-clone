name: Firbo real local-operation checks
on:
  push:
    branches: [codex/firbo-unified-gateway, claude/omniroute-engine]
    paths: ['frontend/public/firbo-connector.mjs', 'tests/firbo/connector-execution.test.mjs', '.github/workflows/firbo-local-execution.yml']
  pull_request:
    branches: [claude/omniroute-engine, main]
    paths: ['frontend/public/firbo-connector.mjs', 'tests/firbo/connector-execution.test.mjs', '.github/workflows/firbo-local-execution.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firbo-local-execution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-operations:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Real temporary file and process tests; mocked HTTP, no accounts
        run: node --test tests/firbo/connector-execution.test.mjs

name: Firbo reviewed local model installation
on:
  push:
    branches: [codex/firbo-unified-gateway]
    paths: ['.github/workflows/firbo-local-source-once.yml','tests/firbo/local-transfer-*.once.b64']
permissions:
  contents: read
jobs:
  reviewed:
    if: github.repository == 'conpol84/javris-clone' && github.event.head_commit.message == 'Verify complete local model installation and Gateway draft interface'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Apply only the hash-verified reviewed source
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          raw=base64.b64decode(''.join(Path(f'tests/firbo/local-transfer-{i}.once.b64').read_text() for i in range(3)),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='a425f805aa3040cad82ffcb94ed246b5ec4bf41b7f989c51d52ab905945afbd4'
          changes=json.loads(gzip.decompress(raw))
          allowed={'src/openjarvis/server/free_inference.py','src/openjarvis/server/firbo_free_app.py','frontend/src/components/gateway/LocalComputePanel.tsx','frontend/src/pages/GatewayLegacyPanel.tsx','deploy/hostinger/local_model_rollout.py','tests/firbo/test_free_app.py','tests/firbo/test_local_rollout.py','tests/firbo/local_model_docker.py','tests/firbo/local_compute_browser.py','.github/workflows/firbo-local-model.yml'}
          assert set(changes)==allowed
          blob=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          for name,e in changes.items():
            p=Path(name)
            if 'before' in e:
              old=p.read_bytes();assert blob(old)==e['before'],name
              lines=old.decode().splitlines(True)
              for start,end,value in reversed(e['edits']):lines[start:end]=[value]
              value=''.join(lines).encode()
            else:
              assert not p.exists(),name
              value=e['content'].encode()
            assert blob(value)==e['after'],name
            p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(value)
          Path('/tmp/firbo-local-manifest.json').write_text(json.dumps(changes))
          PY
      - name: Local runtime and installer guard tests
        run: |
          python3 -m venv /tmp/firbo-local-python
          /tmp/firbo-local-python/bin/pip install -r tests/firbo/requirements.txt
          mkdir -p /tmp/firbo-local-evidence
          set -o pipefail
          /tmp/firbo-local-python/bin/python -m pytest -q -c /dev/null --confcutdir=tests/firbo tests/firbo/test_control_plane.py tests/firbo/test_free_inference.py tests/firbo/test_free_app.py tests/firbo/test_local_capacity.py tests/firbo/test_local_rollout.py | tee /tmp/firbo-local-evidence/python.txt
      - name: Actual model weights and complete Docker deployment/rollback lifecycle
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_REPOSITORY python3 tests/firbo/local_model_docker.py
      - run: npm install --global npm@11.19.0
      - run: npm ci
        working-directory: frontend
      - name: Complete frontend regression and page workbench
        working-directory: frontend
        run: |
          set -o pipefail
          npm test | tee /tmp/firbo-local-evidence/frontend-tests.txt
          npm run build:tauri | tee /tmp/firbo-local-evidence/frontend-build.txt
          npx --no-install vite build --config vite.pages.config.ts
      - name: Actual Gateway interface with synthetic service responses
        run: |
          /tmp/firbo-local-python/bin/pip install playwright==1.57.0
          /tmp/firbo-local-python/bin/python -m playwright install --with-deps chromium
          (cd frontend && npx --no-install vite preview --config vite.pages.config.ts --host 127.0.0.1 --port 5211) >/tmp/firbo-local-vite.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5211/ >/dev/null && break; sleep 1; done
          /tmp/firbo-local-python/bin/python tests/firbo/local_compute_browser.py
      - name: Preserve verified blobs without branch changes or deployment
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const changes=JSON.parse(fs.readFileSync('/tmp/firbo-local-manifest.json','utf8'));
          const entries=[];
          for(const [path,e]of Object.entries(changes)){
            const r=await fetch('https://api.github.com/repos/conpol84/javris-clone/git/blobs',{method:'POST',headers:{authorization:'Bearer '+process.env.GH_TOKEN,'content-type':'application/json',accept:'application/vnd.github+json'},body:JSON.stringify({content:fs.readFileSync(path,'utf8'),encoding:'utf-8'})});
            if(!r.ok)throw new Error('Git blob HTTP '+r.status);const b=await r.json();if(b.sha!==e.after)throw new Error('Hash mismatch '+path);
            entries.push({path,mode:'100644',type:'blob',sha:b.sha});
          }
          fs.writeFileSync('/tmp/firbo-local-evidence/verified-blobs.json',JSON.stringify({source_parent:process.env.GITHUB_SHA,entries},null,2));
          console.log('FIRBO_LOCAL_VERIFIED_BLOBS '+JSON.stringify(entries));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: firbo-local-install-verified
          path: |
            /tmp/firbo-local-evidence/
            /tmp/firbo-local-vite.log
          retention-days: 7

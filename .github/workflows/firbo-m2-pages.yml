name: Firbo M2 actual-page mobile checks
on:
  push:
    branches: [codex/firbo-unified-gateway]
    paths: ['frontend/**', 'tests/firbo/pages/**', '.github/workflows/firbo-m2-pages.yml']
  pull_request:
    branches: [claude/omniroute-engine]
    paths: ['frontend/**', 'tests/firbo/pages/**', '.github/workflows/firbo-m2-pages.yml']
permissions:
  contents: read
concurrency:
  group: firbo-m2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.0
      - run: npm ci
        working-directory: frontend
      - name: Build isolated full-page workbench with fake data (not deployable production)
        run: npx --no-install vite build --config vite.pages.config.ts
        working-directory: frontend
      - name: Browser dependencies without application secrets
        run: |
          python3 -m venv /tmp/firbo-m2-venv
          /tmp/firbo-m2-venv/bin/pip install playwright==1.57.0
          /tmp/firbo-m2-venv/bin/python -m playwright install --with-deps chromium
      - name: Actual-page phone/tablet/desktop checks with all external requests blocked
        run: |
          set -euo pipefail
          (cd frontend && npx --no-install vite preview --config vite.pages.config.ts --host 127.0.0.1 --port 5211) >/tmp/firbo-m2-vite.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5211/ >/dev/null && break; sleep 1; done
          BASE_RESULT=0
          /tmp/firbo-m2-venv/bin/python tests/firbo/pages/verify.py || BASE_RESULT=$?
          EXTRA_RESULT=0
          /tmp/firbo-m2-venv/bin/python tests/firbo/pages/verify_extra.py || EXTRA_RESULT=$?
          test "$BASE_RESULT" -eq 0 && test "$EXTRA_RESULT" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: firbo-m2-page-evidence
          path: |
            /tmp/firbo-m2-evidence/
            /tmp/firbo-m2-vite.log
          retention-days: 7

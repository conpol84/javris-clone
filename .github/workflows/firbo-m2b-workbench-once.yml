name: Firbo M2-B local workbench snapshot
on:
  push:
    branches: [codex/firbo-unified-gateway]
    paths: ['.github/workflows/firbo-m2b-workbench-once.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.head_commit.message == 'Prepare isolated M2-B Computer Manager workbench without runtime credentials'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - name: Package tracked source and installed test toolchain only
        run: |
          mkdir -p /tmp/firbo-m2b-local
          git archive --format=tar HEAD frontend tests docs .github supabase/functions/connector | gzip > /tmp/firbo-m2b-local/source.tar.gz
          tar -czf /tmp/firbo-m2b-local/toolchain.tar.gz -C frontend node_modules
          printf '%s\n' "$GITHUB_SHA" > /tmp/firbo-m2b-local/SOURCE_COMMIT.txt
          sha256sum /tmp/firbo-m2b-local/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firbo-m2b-local-workbench
          path: /tmp/firbo-m2b-local/
          retention-days: 1

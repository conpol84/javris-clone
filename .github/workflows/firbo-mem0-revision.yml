name: FIRBO Mem0 revision interoperability
on:
  pull_request:
    branches: [claude/gifted-dijkstra-rph5j8]
    paths:
      - 'supabase/functions/_shared/mem0-retrieval-boundary.ts'
      - 'supabase/migrations/20261008094255_mem0_canonical_revision.sql'
      - 'tests/firbo/mem0-revision*'
      - '.github/workflows/firbo-mem0-revision.yml'
      - 'docs/FIRBO-MEM0-REVISION-20261008.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firbo_mem0_revision
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres -d firbo_mem0_revision'
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/firbo_mem0_revision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.10'
      - run: node --test tests/firbo/mem0-retrieval-boundary.test.mjs tests/firbo/mem0-revision.test.mjs
      - run: psql "$DATABASE_URL" -f tests/firbo/mem0-current-rows-fixture.sql
      - run: psql "$DATABASE_URL" -f supabase/migrations/20261007232424_mem0_current_rows_reader.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261008094255_mem0_canonical_revision.sql
      - run: python tests/firbo/mem0-revision-postgres.py

name: FIRBO memory RLS PostgreSQL acceptance

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/firbo/sql/**'
      - '.github/workflows/firbo-memory-rls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-tenant-isolation:
    name: RLS ownership, legacy and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-fixture
          POSTGRES_DB: firbo_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d firbo_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Apply real migration to disposable fixture and assert row isolation
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci-only-fixture
          PGDATABASE: firbo_fixture
        run: psql -X -v ON_ERROR_STOP=1 -f tests/firbo/sql/sgmem01_staging_rls.sql

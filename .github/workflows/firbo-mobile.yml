name: Firbo M1 shared-component reflow
on:
  push:
    branches: [codex/firbo-unified-gateway]
    paths: ['frontend/**', 'tests/firbo/mobile/**', '.github/workflows/firbo-mobile.yml']
  pull_request:
    branches: [claude/omniroute-engine]
    paths: ['frontend/**', 'tests/firbo/mobile/**', '.github/workflows/firbo-mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firbo-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared-components:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.0
      - run: npm ci
        working-directory: frontend
      - name: Isolated test browser (no production secrets)
        run: |
          python3 -m venv /tmp/firbo-mobile-venv
          /tmp/firbo-mobile-venv/bin/pip install playwright==1.57.0
          /tmp/firbo-mobile-venv/bin/python -m playwright install --with-deps chromium
      - name: Render real shared components and exercise narrow viewports
        run: |
          set -euo pipefail
          (cd frontend && npx --no-install vite --config vite.mobile.config.ts) > /tmp/firbo-mobile-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5210/ >/dev/null; then break; fi
            sleep 1
          done
          /tmp/firbo-mobile-venv/bin/python tests/firbo/mobile/verify.py
      - name: Retain only synthetic screenshots and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firbo-m1-reflow-evidence
          path: |
            /tmp/firbo-mobile-evidence/
            /tmp/firbo-mobile-vite.log
          retention-days: 7
          if-no-files-found: warn

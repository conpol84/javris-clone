name: Firbo exact native approval
on:
  pull_request:
    branches: [main, claude/gifted-dijkstra-rph5j8]
    paths:
      - 'src/openjarvis/server/**'
      - 'src/openjarvis/tools/_stubs.py'
      - 'deploy/hostinger/*approval*'
      - 'deploy/hostinger/verify-openjarvis-artifact.py'
      - 'tests/firbo/test_native_approval.py'
      - '.github/workflows/firbo-native-approval.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  approval:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 fastapi==0.142.2 httpx==0.28.1 click==8.5.0 rich==15.0.0 pyyaml==6.0.3 numpy==2.5.3 ruff==0.16.10 tomlkit==0.15.1 psutil==7.2.2 croniter==6.2.4 aiofiles==25.1.0 requests==2.34.2 python-multipart==0.0.32
      - name: Actual executor, handler, files, races and rollback; no providers
        env:
          PYTHONPATH: src
        run: python -m pytest tests/firbo/test_native_approval.py tests/firbo/test_artifact_acceptance.py tests/firbo/test_server_execution_receipt.py tests/server/test_routes.py tests/server/test_agent_model_override.py tests/server/test_models_pydantic.py tests/server/test_nonblocking_routes.py tests/server/test_auth_middleware.py tests/server/test_cors_auth_interaction.py -q
      - name: Lint and verify exact bundle
        run: |
          ruff check src/openjarvis/server/native_approval.py src/openjarvis/server/models.py src/openjarvis/server/routes.py deploy/hostinger/native-approval-control.py deploy/hostinger/verify-openjarvis-artifact.py tests/firbo/test_native_approval.py
          ruff format --check src/openjarvis/server/native_approval.py src/openjarvis/server/models.py src/openjarvis/server/routes.py deploy/hostinger/native-approval-control.py deploy/hostinger/verify-openjarvis-artifact.py tests/firbo/test_native_approval.py
      - name: Actual root and unprivileged service separation
        run: sudo env PYTHONPATH=src FIRBO_REQUIRE_UID_TEST=1 "$(command -v python)" -m pytest tests/firbo/test_native_approval.py -k real_root_service_uid_separation -q -rs

name: Firbo actual Ollama capacity workbench
on:
  push:
    branches: [codex/firbo-unified-gateway]
    paths: ['.github/workflows/firbo-ollama-source-once.yml']
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'conpol84/javris-clone' && github.event.head_commit.message == 'Verify real small-model runtime and capture exact current source'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Retain exact source and official image identity
        run: |
          mkdir -p /tmp/firbo-ollama-evidence
          git archive --format=tar.gz HEAD frontend supabase src/openjarvis/server tests/firbo docs deploy .github > /tmp/firbo-ollama-evidence/source.tar.gz
          git rev-parse HEAD > /tmp/firbo-ollama-evidence/source-commit.txt
          docker pull ollama/ollama:0.35.1 >/tmp/firbo-ollama-evidence/image-pull.txt 2>&1
          docker image inspect ollama/ollama:0.35.1 --format '{{json .RepoDigests}}' > /tmp/firbo-ollama-evidence/image-digests.json
      - name: Run an actual local model under explicit CPU and RAM limits
        run: |
          python3 - <<'PY'
          import json,subprocess,time,urllib.request,hashlib,pathlib
          out=pathlib.Path('/tmp/firbo-ollama-evidence')
          data=out/'models';data.mkdir();subprocess.run(['sudo','chown','10001:10001',str(data)],check=True)
          name='firbo-ci-ollama'
          def cmd(*a):return subprocess.check_output(['docker',*a],text=True).strip()
          report={'scope':'Actual Ollama/Qwen model on disposable CI, NOT the customer VPS','cpu_limit':1.25,'memory_gib':3,'paid_api_calls':0}
          try:
            cmd('run','-d','--name',name,'--user','10001:10001','--cpus','1.25','--memory','3g','--memory-swap','3g','--pids-limit','256','--read-only','--cap-drop','ALL','--security-opt','no-new-privileges:true','--tmpfs','/tmp:rw,nosuid,nodev,size=256m','-e','HOME=/var/lib/ollama','-e','OLLAMA_MODELS=/var/lib/ollama/models','-e','OLLAMA_HOST=0.0.0.0:11434','-e','OLLAMA_NO_CLOUD=1','-e','OLLAMA_CONTEXT_LENGTH=2048','-e','OLLAMA_NUM_PARALLEL=1','-e','OLLAMA_MAX_LOADED_MODELS=1','-e','OLLAMA_MAX_QUEUE=1','-e','OLLAMA_KEEP_ALIVE=2m','-v',str(data)+':/var/lib/ollama','ollama/ollama:0.35.1')
            ip=json.loads(cmd('inspect',name))[0]['NetworkSettings']['Networks']['bridge']['IPAddress']
            base='http://'+ip+':11434'
            def api(path,body=None,timeout=150):
              req=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers={'content-type':'application/json'})
              with urllib.request.urlopen(req,timeout=timeout) as r:return json.load(r)
            for i in range(30):
              try:report['version']=api('/api/version',timeout=2);break
              except Exception:time.sleep(1)
            else:raise RuntimeError('ollama_boot_failed')
            subprocess.run(['docker','exec',name,'ollama','pull','qwen3:1.7b'],stdout=open(out/'model-pull.txt','w'),stderr=subprocess.STDOUT,check=True,timeout=600)
            report['models']=api('/api/tags')
            m=data/'models/manifests/registry.ollama.ai/library/qwen3/1.7b'
            raw=m.read_bytes();report['manifest_sha256']=hashlib.sha256(raw).hexdigest();(out/'qwen-manifest.json').write_bytes(raw)
            manifest=json.loads(raw)
            report['license']=(data/'models/blobs'/next(x['digest'].replace(':','-') for x in manifest['layers'] if x['mediaType']=='application/vnd.ollama.image.license')).read_text()[:300]
            cmd('network','create','--internal','firbo-ci-local-model')
            cmd('network','connect','firbo-ci-local-model',name);cmd('network','disconnect','bridge',name)
            ip=json.loads(cmd('inspect',name))[0]['NetworkSettings']['Networks']['firbo-ci-local-model']['IPAddress'];base='http://'+ip+':11434'
            samples=[]
            for prompt in ['Reply with exactly FIRBO_OK.', 'Γράψε μόνο τη λέξη: έτοιμο', 'Add 20 and 30. Reply only with the number.']:
              start=time.monotonic();j=api('/api/chat',{'model':'qwen3:1.7b','messages':[{'role':'user','content':prompt}],'stream':False,'think':False,'keep_alive':'2m','options':{'num_ctx':2048,'num_predict':96,'num_thread':1,'temperature':0}})
              samples.append({'prompt':prompt,'answer':j.get('message',{}).get('content'),'done':j.get('done'),'done_reason':j.get('done_reason'),'elapsed_seconds':round(time.monotonic()-start,3),'eval_count':j.get('eval_count'),'eval_duration_ns':j.get('eval_duration'),'prompt_eval_count':j.get('prompt_eval_count')})
              report['samples']=samples;(out/'actual-model-results.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
              assert j.get('done') is True and j.get('message',{}).get('content','').strip()
            report['container_stats']=json.loads(cmd('stats','--no-stream','--format','{{json .}}',name))
            report['no_published_ports']=not json.loads(cmd('inspect',name))[0]['HostConfig']['PortBindings']
            report['status']='actual_model_generated_responses'
          finally:
            (out/'actual-model-results.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
            subprocess.run(['docker','rm','-f',name],capture_output=True)
            subprocess.run(['docker','network','rm','firbo-ci-local-model'],capture_output=True)
            subprocess.run(['sudo','rm','-rf',str(data)],check=False)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: firbo-actual-ollama-evidence
          path: /tmp/firbo-ollama-evidence/
          retention-days: 7

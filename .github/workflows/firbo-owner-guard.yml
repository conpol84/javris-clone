name: Firbo company ownership protection
on:
  pull_request:
    branches: [main, claude/omniroute-engine, claude/gifted-dijkstra-rph5j8]
    paths: ['supabase/migrations/**', 'tests/firbo/people/**', '.github/workflows/firbo-owner-guard.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firbo-owner-guard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: firbo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d firbo_test"
          --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: firbo_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Load real tenancy policies and ownership trigger
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/firbo/people/postgres-fixture.sql
          python3 - <<'PY'
          from pathlib import Path
          source=Path('supabase/migrations/20261001000001_core_tenancy.sql').read_text()
          # The core tenancy tables do not use vectors; stock PostgreSQL lacks pgvector.
          source=source.replace('create extension if not exists vector with schema extensions;', '')
          Path('/tmp/firbo-core-tenancy.sql').write_text(source)
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/firbo-core-tenancy.sql
          psql -X -v ON_ERROR_STOP=1 -c 'grant select,insert,update,delete on all tables in schema public to authenticated;'
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261005213618_firbo_preserve_last_owner.sql
      - name: RLS, ownership handoff, bulk changes and cascades
        run: |
          { echo 'begin;'; cat tests/firbo/people/postgres-regressions.sql; echo 'rollback;'; } | psql -X -v ON_ERROR_STOP=1
      - name: Competing owner removals under three isolation levels
        run: python3 tests/firbo/people/postgres-concurrency.py

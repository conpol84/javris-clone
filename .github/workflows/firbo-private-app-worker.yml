name: Firbo private application worker
on:
  pull_request:
    branches: [claude/gifted-dijkstra-rph5j8]
    paths:
      - 'deploy/worker/**'
      - 'tests/firbo/test_private_app_worker.py'
      - '.github/workflows/firbo-private-app-worker.yml'
  push:
    branches: [claude/gifted-dijkstra-rph5j8]
    paths:
      - 'deploy/worker/**'
      - 'tests/firbo/test_private_app_worker.py'
      - '.github/workflows/firbo-private-app-worker.yml'
permissions:
  contents: read
jobs:
  real-private-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '${{ matrix.python }}'}
      - name: Real SQLite/HTTP worker, isolation and cancellation
        run: python -m unittest discover -s tests/firbo -p test_private_app_worker.py -v
      - name: Syntax validation
        run: python -m py_compile deploy/worker/firbo_worker.py

name: Firbo runner complete bundle
on:
  pull_request:
    branches: [claude/gifted-dijkstra-rph5j8]
    paths:
      - 'supabase/functions/agent-runner/**'
      - 'supabase/functions/_shared/**'
      - 'deploy/firbo-agent-runner-bundle.json'
      - 'tools/firbo-runner-bundle.mjs'
      - 'tests/firbo/agent-runner-bundle.test.mjs'
      - '.github/workflows/firbo-runner-bundle.yml'
permissions:
  contents: read
jobs:
  complete-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22.22.0'}
      - name: Link exact source and verify complete release manifest
        run: node --experimental-strip-types --test tests/firbo/agent-runner-bundle.test.mjs

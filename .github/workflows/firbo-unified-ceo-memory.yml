name: FIRBO one CEO owner-scoped memory acceptance

on:
  pull_request:
    paths:
      - 'frontend/src/lib/company/ceo-session-continuity*'
      - 'frontend/src/lib/company/useCeoSession.ts'
      - 'frontend/src/pages/AgentChatPage.tsx'
      - 'frontend/src/pages/CeoPage.tsx'
      - 'frontend/src/lib/company/memory-visibility.test.ts'
      - 'supabase/functions/_shared/memory-visibility.ts'
      - 'supabase/functions/agent-chat/index.ts'
      - 'supabase/functions/agent-runner/index.ts'
      - 'tests/firbo/ceo-memory-security.test.mjs'
      - 'deploy/firbo-agent-runner-bundle.json'
      - '.github/workflows/firbo-unified-ceo-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unified-ceo:
    name: One CEO, owner session isolation, secure inference, frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Source/closure digest for exact-head pinned deployment
        run: |
          sha256sum supabase/functions/agent-runner/index.ts
          wc -c supabase/functions/agent-runner/index.ts
      - name: Prove ownerless and cross-user memory cannot be injected
        run: node --test tests/firbo/ceo-memory-security.test.mjs tests/firbo/ceo-session-recall.test.mjs
      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: |
          npm install --global npm@11.19.0
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend session and memory regression
        working-directory: frontend
        run: |
          npm test -- --run src/lib/company/ceo-session-continuity.test.ts src/lib/company/ceo-sessions.test.ts src/lib/company/memory-visibility.test.ts
      - name: Full frontend regression and production build
        working-directory: frontend
        run: |
          npm test
          npm run build

name: Firbo voice source snapshot
on:
  push:
    branches: [codex/firbo-unified-gateway]
    paths: ['.github/workflows/firbo-voice-source-once.yml']
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'conpol84/javris-clone' && github.event.head_commit.message == 'Prepare exact-source voice and hologram verification workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked source only; no credentials or runtime files
        run: |
          mkdir -p /tmp/firbo-voice-source
          git rev-parse HEAD > /tmp/firbo-voice-source/SOURCE_COMMIT.txt
          git archive --format=tar.gz HEAD frontend supabase tests/firbo docs .github/workflows > /tmp/firbo-voice-source/source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: firbo-voice-source
          path: /tmp/firbo-voice-source/
          retention-days: 1
          if-no-files-found: error

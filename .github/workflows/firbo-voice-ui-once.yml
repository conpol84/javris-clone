name: Firbo exact voice UI candidate
on:
  push:
    branches: [codex/firbo-unified-gateway]
    paths: ['.github/workflows/firbo-voice-ui-once.yml', 'tests/firbo/voice/ui-edits.once.json']
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'conpol84/javris-clone' && github.event.head_commit.message == 'Prepare exact reviewed voice UI candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply only locally reviewed, hash-verified UI edits
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          def sha(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          edits=json.loads(Path('tests/firbo/voice/ui-edits.once.json').read_text())
          allowed={'frontend/src/components/command/TalkConsole.tsx','frontend/src/components/scenes/CeoStage.tsx','frontend/src/components/scenes/CoreOrb.tsx','frontend/src/components/scenes/HoloHead.tsx','frontend/src/pages/AgentChatPage.tsx','frontend/src/pages/CeoPage.tsx'}
          assert set(edits)==allowed
          for name,item in edits.items():
            p=Path(name);old=p.read_bytes();assert sha(old)==item['before'],name
            lines=old.decode().splitlines(True)
            for start,end,new in reversed(item['edits']):lines[start:end]=[new]
            result=''.join(lines).encode();assert sha(result)==item['after'],name
            p.write_bytes(result)
          PY
      - run: npm install --global npm@11.19.0
      - run: npm ci
        working-directory: frontend
      - name: Verify candidate code before storing Git objects
        working-directory: frontend
        run: |
          npm test
          npx --no-install tsc -b
          npm run build:tauri
      - name: Store verified six-file candidate; never update a branch or deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const edits=JSON.parse(fs.readFileSync('tests/firbo/voice/ui-edits.once.json','utf8'));
          async function api(path,body){const r=await fetch('https://api.github.com/repos/conpol84/javris-clone'+path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+process.env.GH_TOKEN,'content-type':'application/json',accept:'application/vnd.github+json'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw new Error('Git API '+r.status);return r.json();}
          const entries=[];
          for(const [path,item] of Object.entries(edits)){const b=await api('/git/blobs',{content:fs.readFileSync(path,'utf8'),encoding:'utf-8'});if(b.sha!==item.after)throw new Error('Blob mismatch '+path);entries.push({path,mode:'100644',type:'blob',sha:b.sha});}
          for(const path of ['tests/firbo/voice/ui-edits.once.json','.github/workflows/firbo-voice-ui-once.yml'])entries.push({path,mode:'100644',type:'blob',sha:null});
          const base=await api('/git/commits/'+process.env.GITHUB_SHA);
          const tree=await api('/git/trees',{base_tree:base.tree.sha,tree:entries});
          console.log('FIRBO_VOICE_UI_TREE '+tree.sha);
          console.log('FIRBO_VOICE_UI_PARENT '+process.env.GITHUB_SHA);
          console.log('FIRBO_VOICE_UI_FILES '+JSON.stringify(entries));
          NODE

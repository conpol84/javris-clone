name: Firbo voice and hologram lifecycle
on:
  push:
    branches: [codex/firbo-unified-gateway]
    paths: ['frontend/**', 'tests/firbo/voice/**', '.github/workflows/firbo-voice.yml']
  pull_request:
    branches: [claude/omniroute-engine]
    paths: ['frontend/**', 'tests/firbo/voice/**', '.github/workflows/firbo-voice.yml']
permissions:
  contents: read
concurrency:
  group: firbo-voice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.0
      - run: npm ci
        working-directory: frontend
      - name: Voice state, cancellation and media unit checks
        run: npx --no-install vitest run src/lib/company/voice.test.ts
        working-directory: frontend
      - name: Build isolated actual-voice-page workbench
        run: npx --no-install vite build --config vite.voice.config.ts
        working-directory: frontend
      - name: Browser dependencies without runtime credentials
        run: |
          python3 -m venv /tmp/firbo-voice-venv
          /tmp/firbo-voice-venv/bin/pip install playwright==1.57.0
          /tmp/firbo-voice-venv/bin/python -m playwright install --with-deps chromium
      - name: Actual screens, generated audio and synthetic microphone
        run: |
          set -euo pipefail
          (cd frontend && npx --no-install vite preview --config vite.voice.config.ts --host 127.0.0.1 --port 5212) >/tmp/firbo-voice-vite.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5212/ >/dev/null && break; sleep 1; done
          /tmp/firbo-voice-venv/bin/python tests/firbo/voice/verify.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: firbo-voice-lifecycle-evidence
          path: |
            /tmp/firbo-voice-evidence/
            /tmp/firbo-voice-vite.log
          retention-days: 7

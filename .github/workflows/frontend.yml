name: Frontend CI
on:
  push:
    branches: [main, claude/omniroute-engine, codex/firbo-unified-gateway]
    paths: ['frontend/**', 'tests/firbo/**', 'supabase/functions/_shared/**', 'supabase/functions/agent-chat/**', 'supabase/functions/agent-runner/**', '.github/workflows/frontend.yml']
  pull_request:
    branches: [main, claude/omniroute-engine, claude/gifted-dijkstra-rph5j8]
    paths: ['frontend/**', 'tests/firbo/**', 'supabase/functions/_shared/**', 'supabase/functions/agent-chat/**', 'supabase/functions/agent-runner/**', '.github/workflows/frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use the repository's reviewed npm toolchain
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm test
      - name: Native control contract tests
        run: node --experimental-strip-types --test ../tests/firbo/native-control.test.mjs
      - name: Shared gateway and actual handler regression tests (mocked services)
        run: node --experimental-strip-types --test ../tests/firbo/gateway-routing.test.mjs ../tests/firbo/edge-entrypoints.test.mjs
      - name: Isolated Edge Function type check (SDK stub, not deployed runtime)
        run: npx tsc --project ../tests/firbo/tsconfig.edge.json
      - run: npx tsc -b
      - run: npm run build:tauri
  core-design-rendered:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global npm@11.19.0
      - run: npm ci --prefix frontend
      - run: npm ci --prefix tools/firbo-browser-runtime --ignore-scripts
      - run: npx --prefix tools/firbo-browser-runtime playwright install --with-deps chromium
      - name: Actual core controls at desktop and mobile widths (localhost only)
        run: |
          npm --prefix frontend run dev -- --host 127.0.0.1 --port 5218 > /tmp/firbo-core-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5218/scene-test.html > /dev/null; then break; fi
            sleep 1
          done
          node tests/firbo/core-design-rendered.mjs

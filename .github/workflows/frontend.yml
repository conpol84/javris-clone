name: Frontend CI
on:
  push:
    branches: [main, claude/omniroute-engine, codex/firbo-unified-gateway]
    paths: ['frontend/**', 'tests/firbo/native-control.test.mjs', '.github/workflows/frontend.yml']
  pull_request:
    branches: [main, claude/omniroute-engine]
    paths: ['frontend/**', 'tests/firbo/native-control.test.mjs', '.github/workflows/frontend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use the repository's reviewed npm toolchain
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm test
      - name: Native control contract tests
        run: node --experimental-strip-types --test ../tests/firbo/native-control.test.mjs
      - run: npx tsc -b
      - run: npm run build:tauri

# STAGING CANDIDATE ONLY. Not a live overlay for the existing stack.
# Requires a reviewed image digest and explicit activation of profile local-models.
# No published Ollama port. No automatic model pull. No paid/cloud Ollama login.
# Do not attach to production until capacity/model tests and coordinated API rollout.
services:
  firbo-ollama:
    image: "${FIRBO_OLLAMA_PINNED_IMAGE:?Set reviewed ollama/ollama@sha256 digest}"
    profiles: [local-models]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    cpus: "${FIRBO_OLLAMA_CPUS:-2}"
    mem_limit: "${FIRBO_OLLAMA_MEMORY:-4g}"
    memswap_limit: "${FIRBO_OLLAMA_MEMORY:-4g}"
    environment:
      HOME: /var/lib/ollama
      OLLAMA_MODELS: /var/lib/ollama/models
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_KEEP_ALIVE: 2m
    volumes:
      # Operator must create this directory, owned by10001:10001, with reviewed models.
      - "${FIRBO_OLLAMA_DATA_DIR:?Set an existing private model directory}:/var/lib/ollama"
    tmpfs: [/tmp:rw,nosuid,nodev,size=256m]
    networks: [firbo_local]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  firbo_local:
    internal: true
# The matched Firbo API must also join firbo_local. It forwards only text inference,
# never model-management APIs. Model download is a separate controlled staging step.
